icina de Acceso a la Información Pública como autoridad de aplicación.","Dip. Óscar Agost Carreño: Consideró el proyecto oficial \"excesivamente regularista\" 55. Propuso un registro gratuito digital y un código de conducta articulado por una agencia autónoma que diferencie los tipos de lobby. Sugirió regular los nuevos canales de influencia como redes sociales, trolls y bots.","Dip. Galmarini: Presentó un proyecto de reforma integral de ética pública (131 artículos) que propone la creación del \"Instituto Nacional de Integridad y Ética Pública\" autónomo, endógeno y con facultades de alerta temprana para funcionarios, proveedores y contratistas.","Dip. Propato: Exigió discutir los conflictos de intereses de los funcionarios que provienen de corporaciones privadas y abogó por transparentar licitaciones estratégicas de infraestructura como la hidrovía o las centrales nucleares.","Dip. Caposi: Adelantó el acompañamiento en general del bloque PRO pero con disidencia parcial, buscando limitar el alcance al lobby profesionalizado, eliminar las penas de prisión para particulares y radicar el control en comisiones parlamentarias bicamerales.","Bloques de Oposición y de Izquierda (Rechazo al Proyecto):","Dip. Germán Martínez (Unión por la Patria): Sostuvo que el proyecto aísla a la política, limita la representación directa de los legisladores con su pueblo y fomenta una terciarización profesionalizada del lobby. Denunció que el oficialismo pretende regular la relación cívica mientras se debaten opacamente proyectos como el \"superrigi\" 74.","Dip. Diego Juliano (Unión por la Patria): Calificó el proyecto de un \"blanqueo de presiones\" que privatiza el acceso al poder y advirtió que el paquete penal del PEN funciona como una ley penal más benigna que reduce de forma retroactiva las penas del Código Penal vigentes para delitos contra la administración pública.","Dip. Romina del Pla y Dip. Nicolás del Caño (Frente de Izquierda): Rechazaron de plano el proyecto, denunciando que busca legalizar y estatizar a cielo abierto el soborno de las corporaciones capitalistas, mientras criminaliza con penas de prisión la protesta social y los reclamos colectivos populares.","Organizaciones de la Sociedad Civil, Derechos Humanos, Ambientales y Sociales:","Poder Ciudadano, Directorio Legislativo, ACIJ, Amnistía Internacional y CELS: Coincidieron en que la ley es un instrumento hostil e inconstitucional que busca \"disciplinar y vigilar\" a la sociedad civil en lugar de transparentar el poder. Cuestionaron que equipare la defensa de derechos humanos o el reclamo de familiares de víctimas con el lobby corporativo comercial, que la inscripción previa funcione como un \"permiso estatal para peticionar\" 90-92, y denunciaron la asimetría penal de las penas de prisión para particulares frente a simples faltas para los funcionarios.","FARN, Círculo de Políticas Ambientales y ANDES: Señalaron que el proyecto viola el Acuerdo de Escasú al obstaculizar y restringir de forma regresiva la participación cívica en materia de recursos naturales y cambio climático, generando un grave \"efecto disuasorio\" (chilling effect). Balino alertó sobre el impacto desigual del proyecto en el NOA, donde silenciará a las comunidades campesinas e indígenas frente a los intereses fácticos del extractivismo del litio y de la minería.","Raci y FAIE (Fep hora de obrar): Denunciaron el capítulo de \"interés extranjero\" como una copia de marcos autoritarios represivos de la región (Nicaragua, El Salvador) y el mundo (Rusia, Hungría) que estigmatiza y criminaliza la cooperación internacional filantrópica y de derechos humanos.","Red de Encuentro, Ready y Fundación Huésped: Advirtieron que la pesada carga burocrática y los reportes trimestrales son imposibles de cumplir para ONGs territoriales de base o de personas con discapacidad que carecen de personal rentado o equipos legales. Cahn advirtió que el temor de recibir causas penales por errores de papeleo empujará al silencio a médicos y científicos, perjudicando las alertas sanitarias y la salud pública de la población. González denunció que la ley fue redactada ignorando la consulta estrecha obligatoria exigida por la Convención con rango constitucional.","Innocence Project y Fundación Vía Libre: Cuestionaron la filosofía que impone controles sobre los ciudadanos y no sobre el Estado. Busaniche alertó sobre la creación de una masiva base de datos de actividades y financiamiento cívico que, bajo el DNU 941/25, deberá ser transferida de forma directa y sin control judicial a los servicios de inteligencia (SIDE).","Fundación Barbechando y Civic House: Propusieron que la ley establezca umbrales mínimos de frecuencia, dedicación y compensación económica para regular exclusivamente el lobby profesionalizado remunerado (modelo de EE.UU.), y que el registro funcione a posteriori.","Cámaras Empresarias y de Relaciones Públicas:","AmCham y Unión Industrial Argentina (UIA): Respaldaron la transparencia pero reclamaron excluir las comunicaciones derivadas de relaciones contractuales, las transacciones ordinarias o la representación gremial sectorial. Demandaron incorporar la figura de \"beneficiario colectivo\" 122, 123 y suprimir las sanciones penales y la inhabilitación definitiva para el ejercicio del derecho constitucional de petición.","Consejo Profesional de RR.PP. y Círculo Dircom: Sostuvieron que el plazo administrativo de 10 días para aprobar la inscripción suspende de hecho el derecho constitucional de petición, por lo que propusieron una aprobación automática por silencio positivo. Solicitaron reportes anuales (en vez de trimestrales) 128 y equiparar de forma simétrica las penalidades para gestores y funcionarios públicos.","Colegios Profesionales, Periodistas y Sindicatos:","Colegio Público de la Abogacía de la Capital Federal (CPACF) y Colegio de Abogados de la Ciudad de Buenos Aires: Sostuvieron que el proyecto colisiona de manera directa con la Ley 23.187 de ejercicio profesional al obligar a revelar la identidad de los clientes y los temas tratados en asesorías técnicas, vulnerando de manera flagrante el secreto profesional y el derecho de defensa. Reclamaron reformas puntuales para excluir el patrocinio y asesoramiento jurídico del alcance del lobby.","Sindicato de Prensa de Buenos Aires (SiPreBA) y FOPEA: Denunciaron que la ambigüedad en el artículo 4 (que excluye al periodismo \"siempre que no tenga por objeto influir en una decisión\") convierte la ley en un \"cepo\" y una \"herramienta de palo\" susceptible de uso selectivo contra el periodismo de investigación, vulnerando además el secreto profesional de las fuentes periodísticas."],"camara":"Diputados"},"orden_del_dia_detalle":null,"sancion_detalle":null},"sin_datos_de_planilla":true},{"expediente":"Mensaje PEN N° 223/26 (Diputados)","origen":null,"autor":"Poder Ejecutivo Nacional","url":null,"titulo":"Simplificación tributaria y actualización del régimen de sanciones laborales (Inocencia Fiscal 2)","nombre_corto":"Inocencia fiscal","caratula_original":null,"categoria":"en_comision","badge_camara":null,"camara_actual":"Diputados","tramite":{"ingreso":null,"comisiones":[],"fecha_ingreso_dictamen":[],"orden_del_dia":null,"sancion_fecha":null},"timeline":{"camara_origen":"Diputados","camara_revisora":"Senado","origen_hitos":{"ingreso":null,"dictamen":null,"sancion":null},"revisora_hitos":{"ingreso":null,"dictamen":null,"sancion":null}},"nota":{"resumen_mensaje_pen":["Propone modificaciones a las Leyes Nros. 11.683 (Procedimiento Tributario), 27.799 (Medidas Fiscales Paliativas y Relevantes, referidas a la modalidad simplificada de declaración jurada de Ganancias y prescripción) y 25.191 (Régimen del Trabajo Agrario - escala de multas).","Fundamenta la iniciativa en dos dimensiones: perfeccionar y dar mayor seguridad jurídica al régimen simplificado (equilibrando las garantías de los contribuyentes con la fiscalización) y actualizar el esquema sancionatorio agrario para devolverle su efecto disuasorio bajo principios de razonabilidad y proporcionalidad."],"resumen_expediente":["Introduce mejoras estructurales en Ganancias, eliminando las trabas de ingresos y patrimonio para permitir que todas las personas humanas y sucesiones indivisas residentes en el país puedan optar por la modalidad simplificada (los grandes contribuyentes podrán adherir únicamente para la presentación y el pago, sin gozar de los beneficios adicionales del régimen).","Establece parámetros objetivos de fiscalización, redefiniendo la \"discrepancia significativa\" para impugnaciones de la Agencia de Recaudación y Control Aduanero (ARCA) en un incremento de impuesto determinado o reducción de quebrantos no inferior al 15%, sumando un umbral mínimo del 5% del Régimen Penal Tributario para evitar ajustes desproporcionados, limitando presunciones legales e implementando multas del RENATRE actualizadas anualmente por Unidad de Valor Adquisitivo (UVA)."],"reunion_comision":{"fecha":"05/08/2026","comision":"Plenario de las Comisiones de Presupuesto y Hacienda, y de Legislación Penal de la HCDN","resumen":"Reunión de carácter informativo en la que expusieron funcionarios de la Secretaría de Hacienda del Ministerio de Economía y un director del Banco Central, seguida por un debate con preguntas de los diputados.","posturas_principales":["Claudia Valestrini (Subsecretaria de Ingresos Públicos del Ministerio de Economía): Explicó que el proyecto busca dar certeza jurídica y simplificación técnica en la presentación de declaraciones de Ganancias utilizando información que ARCA ya posee, sin alterar la liquidación del gravamen ni anular las facultades de control del fisco. Justificó que los funcionarios públicos sigan incluidos porque la simplificación no los exime de detallar su evolución patrimonial obligatoria ante la Oficina Anticorrupción.","Juan José Imirizaldu (Director Nacional de Impuestos): Detalló los cambios técnicos comparativos, tales como la exigencia de residencia fiscal completa durante todo el período a partir de 2026 23, 24, el plazo límite al 31 de diciembre de 2027 para utilizar fondos no bancarizados 25 y la unificación de plazos (15 días hábiles desde la notificación) para que los contribuyentes presenten declaraciones rectificativas y cancelen saldos ante discrepancias sin perder los beneficios.","Martín Boutaut (Director del Banco Central de la República Argentina): Brindó un panorama macroeconómico y argumentó que para lograr un crecimiento sostenible a largo plazo se requiere aumentar las tasas de inversión. Señaló que este proyecto busca que los argentinos puedan formalizar de forma segura sus ahorros fuera del sistema financiero, estimados por el BCRA en un stock mínimo de USD 170.000 millones de dólares en billetes.","Bloque de Unión por la Patria (Carlos Castañeto, Ariel Rauschenberger, Agustín Ros, Sabrina Selva, Victoria Tolosa Paz, Germán Martínez): Cuestionó por qué se promueve una reforma sobre una ley sancionada hace solo unos meses, denunciando que beneficia a grandes estudios contables y grandes patrimonios en lugar de a pequeños contribuyentes. Criticaron la falta de exclusión de funcionarios públicos y de personas políticamente expuestas (mencionando las inconsistencias del exjefe de Gabinete Manuel Adorni) y alertaron sobre el debilitamiento de las presunciones de ARCA ante depósitos bancarios incompatibles.","Bloque del Frente de Izquierda (Miriam Bregman, Néstor Pitrola, Romina del Plá): Rechazó de plano la iniciativa calificándola de \"blanqueo permanente\" e \"impunidad para grandes evasores\" 41, 42. Cuestionó la baja de los plazos de prescripción de aportes a la seguridad social, el recorte de herramientas de fiscalización a inspectores de ARCA y la reducción de multas por empleo no registrado para las patronales del sector agrario.","Bloque de La Libertad Avanza (Nicolás Mayoraz): Respaldó el proyecto sosteniendo que le devuelve al contribuyente la presunción de inocencia constitucional frente a un sistema administrativo previo que trataba a todos de sospechosos por defecto. Aclaró que la simplificación tributaria no relaja en absoluto las reglas de prevención de lavado de activos de la UIF ni los controles del GAFI.","Bloque del PRO (Silvana Giudici): Apoyó la simplificación operativa señalando que el régimen utiliza datos preexistentes de ARCA. Remarcó que los funcionarios no podrán ocultar sus patrimonios ya que la Oficina Anticorrupción les exige declarar manualmente de forma desagregada toda su evolución patrimonial si optan por el sistema simplificado."],"camara":"Diputados"},"orden_del_dia_detalle":null,"sancion_detalle":null},"sin_datos_de_planilla":true}]}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("proyectos-data").textContent);
  var proyectos = DATA.proyectos;
  var porExpediente = {};
  proyectos.forEach(function (p) { porExpediente[p.expediente] = p; });

  var CATEGORIES = [
    { key: "todos", label: "Todos" },
    { key: "en_comision", label: "En comisión" },
    { key: "con_od", label: "Con OD" },
    { key: "media_sancion", label: "Media sanción" },
    { key: "stats", label: "📊 Estadísticas", noCount: true }
  ];
  var PILL_META = {
    en_comision: { cls: "comision", label: "En comisión" },
    con_od: { cls: "od", label: "Con OD" },
    media_sancion: { cls: "sancion", label: "Media sanción" }
  };
  var CAMARA_META = {
    "1/2 sanción HCDN": { cls: "hcdn", label: "1/2 sanción HCDN" },
    "1/2 sanción HSN": { cls: "hsn", label: "1/2 sanción HSN" }
  };

  var state = { categoria: "todos", camara: "", autor: "", q: "" };

  var elTabs = document.getElementById("tabs");
  var elGrid = document.getElementById("grid");
  var elEmpty = document.getElementById("empty-state");
  var elResultCount = document.getElementById("result-count");
  var elSearch = document.getElementById("search");
  var elCamaraToggle = document.getElementById("camara-toggle");
  var elAutorSelect = document.getElementById("autor-select");
  var elBtnClearFilters = document.getElementById("btn-clear-filters");
  var elStatTotal = document.getElementById("stat-total");
  var elGeneradoAl = document.getElementById("generado-al");
  var elStatsPanel = document.getElementById("stats-panel");
  var elControls = document.getElementById("controls");
  var elViewList = document.getElementById("view-list");
  var elViewDetail = document.getElementById("view-detail");

  elStatTotal.textContent = DATA.total;
  if (DATA.generado_al) {
    elGeneradoAl.textContent = "Datos al " + formatFecha(DATA.generado_al);
  }

  var autores = Array.from(new Set(proyectos.map(function (p) { return p.autor; }))).sort();
  autores.forEach(function (a) {
    var opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    elAutorSelect.appendChild(opt);
  });

  function formatFecha(iso) {
    var parts = iso.split("-");
    if (parts.length !== 3) return iso;
    var d = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
    var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return d.getUTCDate() + " de " + meses[d.getUTCMonth()] + " de " + d.getUTCFullYear();
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function counts() {
    var c = { todos: proyectos.length, en_comision: 0, con_od: 0, media_sancion: 0 };
    proyectos.forEach(function (p) { c[p.categoria]++; });
    return c;
  }

  function renderTabs() {
    var c = counts();
    elTabs.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.className = "tab";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", state.categoria === cat.key ? "true" : "false");
      btn.innerHTML = cat.label + (cat.noCount ? "" : ' <span class="count">' + c[cat.key] + "</span>");
      btn.addEventListener("click", function () {
        state.categoria = cat.key;
        renderTabs();
        renderListView();
      });
      elTabs.appendChild(btn);
    });
  }

  function matches(p) {
    if (state.categoria !== "todos" && state.categoria !== "stats" && p.categoria !== state.categoria) return false;
    if (state.camara && p.camara_actual !== state.camara) return false;
    if (state.autor && p.autor !== state.autor) return false;
    if (state.q) {
      var haystack = (p.nombre_corto + " " + p.titulo + " " + p.expediente).toLowerCase();
      if (haystack.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function pillRowHTML(p) {
    var pills = "";
    // el pill de categoría "Media sanción" es redundante con el badge de cámara: se omite
    if (p.categoria !== "media_sancion") {
      var meta = PILL_META[p.categoria];
      pills += '<span class="pill ' + meta.cls + '">' + meta.label + '</span>';
    }
    var camaraMeta = CAMARA_META[p.badge_camara];
    if (camaraMeta) {
      pills += '<span class="pill ' + camaraMeta.cls + '">' + camaraMeta.label + '</span>';
    }
    return pills;
  }

  function comisionActual(p) {
    var cs = p.tramite.comisiones;
    if (!cs || !cs.length) return null;
    return cs[cs.length - 1].comision;
  }

  function cardHTML(p) {
    var comision = comisionActual(p);
    return (
      '<button class="card" data-expediente="' + p.expediente + '">' +
        '<div class="card-top">' +
          '<span class="expediente">' + p.expediente + '</span>' +
          '<div class="pill-row">' + pillRowHTML(p) + '</div>' +
        '</div>' +
        '<div class="titulo">' + escapeHTML(p.nombre_corto) + '</div>' +
        '<div class="card-bottom">' +
          '<span>' + (comision ? escapeHTML(titleCaseComision(comision)) : "En " + p.camara_actual) + '</span>' +
          '<span>' + (p.tramite.ingreso ? "Ingresó " + p.tramite.ingreso : "") + '</span>' +
        '</div>' +
      '</button>'
    );
  }

  function titleCaseComision(s) {
    if (!s) return s;
    if (s !== s.toUpperCase()) return s;
    return s.charAt(0) + s.slice(1).toLowerCase();
  }

  var currentList = [];

  function renderListView() {
    var isStats = state.categoria === "stats";
    document.querySelector(".filter-row").style.display = isStats ? "none" : "flex";
    elResultCount.style.display = isStats ? "none" : "block";
    elGrid.style.display = isStats ? "none" : "grid";
    elStatsPanel.style.display = isStats ? "block" : "none";
    if (isStats) {
      elEmpty.style.display = "none";
      renderStats();
      return;
    }
    currentList = proyectos.filter(matches);
    elResultCount.textContent = currentList.length + (currentList.length === 1 ? " proyecto encontrado" : " proyectos encontrados");
    if (currentList.length === 0) {
      elGrid.innerHTML = "";
      elEmpty.style.display = "block";
      return;
    }
    elEmpty.style.display = "none";
    elGrid.innerHTML = currentList.map(cardHTML).join("");
    Array.prototype.forEach.call(elGrid.querySelectorAll(".card"), function (card) {
      card.addEventListener("click", function () {
        openTimelineModal(card.getAttribute("data-expediente"));
      });
    });
  }

  function renderStats() {
    var c = counts();
    var total = c.todos || 1;
    var porCamara = { Senado: 0, Diputados: 0 };
    proyectos.forEach(function (p) { porCamara[p.camara_actual] = (porCamara[p.camara_actual] || 0) + 1; });
    var conNota = proyectos.filter(function (p) { return p.nota; }).length;

    var cards = [
      { value: total, label: "Total de proyectos pendientes", cls: "" },
      { value: c.en_comision, label: "En comisión, sin dictamen", cls: "accent-comision" },
      { value: c.con_od, label: "Con Orden del Día emitido", cls: "accent-od" },
      { value: c.media_sancion, label: "Con media sanción", cls: "accent-sancion" },
      { value: porCamara.Senado || 0, label: "Expediente actualmente en el Senado", cls: "accent-hsn" },
      { value: porCamara.Diputados || 0, label: "Expediente actualmente en Diputados", cls: "accent-hcdn" },
      { value: conNota, label: "Con resumen detallado cargado", cls: "" }
    ];

    elStatsPanel.innerHTML =
      '<div class="stats-grid">' + cards.map(function (s) {
        return (
          '<div class="stat-card ' + s.cls + '">' +
            '<div class="stat-value">' + s.value + '</div>' +
            '<div class="stat-label">' + s.label + '</div>' +
          '</div>'
        );
      }).join("") + '</div>';
  }

  // --- Modal de línea de tiempo ---
  var elModalOverlay = document.getElementById("timeline-modal-overlay");
  var elModalClose = document.getElementById("timeline-modal-close");
  var elModalDetailBtn = document.getElementById("timeline-modal-detail-btn");
  var elModalExpediente = document.getElementById("timeline-modal-expediente");
  var elModalTitle = document.getElementById("timeline-modal-title");
  var elModalBody = document.getElementById("timeline-modal-body");
  var modalExpedienteActual = null;
  var modalUltimoFoco = null;

  function chevronHTML() {
    return '<span class="timeline-chevron" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 6 6 6-6 6"/></svg></span>';
  }

  function timelineStepHTML(camara, label, fecha) {
    var camaraCls = camara === "Diputados" ? "hcdn" : "hsn";
    var cls = fecha ? "cumplido " + camaraCls : "pendiente";
    return (
      '<div class="timeline-step ' + cls + '">' +
        '<span class="timeline-dot"></span>' +
        '<span class="timeline-step-label">' + escapeHTML(label) + '</span>' +
        '<span class="timeline-step-fecha">' + (fecha ? escapeHTML(fecha) : "Sin dato") + '</span>' +
      '</div>'
    );
  }

  function timelineReunionHTML(reunion) {
    if (!reunion || !reunion.fecha) return "";
    var comision = reunion.comision ? " · " + escapeHTML(titleCaseComision(reunion.comision)) : "";
    return (
      '<div class="timeline-reunion">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>' +
        ' Reunión de comisión ' + escapeHTML(reunion.fecha) + comision +
      '</div>'
    );
  }

  function timelineTramoHTML(camara, hitos, ultimoLabel, reunion) {
    return (
      '<div class="timeline-tramo">' +
        '<div class="timeline-tramo-header">' + escapeHTML(camara) + '</div>' +
        '<div class="timeline-steps">' +
          timelineStepHTML(camara, "Ingreso", hitos.ingreso) +
          chevronHTML() +
          timelineStepHTML(camara, "Dictamen", hitos.dictamen) +
          chevronHTML() +
          timelineStepHTML(camara, ultimoLabel, hitos.sancion) +
        '</div>' +
        timelineReunionHTML(reunion && reunion.camara === camara ? reunion : null) +
      '</div>'
    );
  }

  function renderTimelineModal(p) {
    var tl = p.timeline;
    var reunion = p.nota && p.nota.reunion_comision;
    elModalExpediente.textContent = p.expediente;
    elModalTitle.textContent = p.titulo || p.nombre_corto;
    elModalBody.innerHTML =
      timelineTramoHTML(tl.camara_origen, tl.origen_hitos, "1/2 Sanción", reunion) +
      '<span class="timeline-arrow-between" aria-hidden="true">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
      '</span>' +
      timelineTramoHTML(tl.camara_revisora, tl.revisora_hitos, "Sanción", reunion);
  }

  function onModalKeydown(e) {
    if (e.key === "Escape") {
      closeTimelineModal();
      return;
    }
    if (e.key === "Tab") {
      var focusables = elModalOverlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!focusables.length) return;
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  }

  function openTimelineModal(expediente) {
    var p = porExpediente[expediente];
    if (!p) return;
    modalExpedienteActual = expediente;
    renderTimelineModal(p);
    modalUltimoFoco = document.activeElement;
    elModalOverlay.style.display = "flex";
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onModalKeydown);
    elModalClose.focus();
  }

  function closeTimelineModal() {
    elModalOverlay.style.display = "none";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onModalKeydown);
    if (modalUltimoFoco) modalUltimoFoco.focus();
  }

  elModalOverlay.addEventListener("click", function (e) {
    if (e.target === elModalOverlay) closeTimelineModal();
  });
  elModalClose.addEventListener("click", closeTimelineModal);
  elModalDetailBtn.addEventListener("click", function () {
    var expediente = modalExpedienteActual;
    closeTimelineModal();
    location.hash = "#/" + expediente;
  });

  // --- Vista de detalle ---
  function bulletListHTML(items, emptyMsg) {
    if (!items || !items.length) {
      return '<p class="empty-note">' + emptyMsg + '</p>';
    }
    return '<ul>' + items.map(function (b) { return '<li>' + escapeHTML(b) + '</li>'; }).join("") + '</ul>';
  }

  function camaraTagHTML(camara) {
    if (!camara) return "";
    var cls = camara === "Diputados" ? "diputados" : "senado";
    return '<span class="camara-tag ' + cls + '">Cámara de ' + escapeHTML(camara) + '</span>';
  }

  function tramiteComisionesHTML(p) {
    var cs = p.tramite.comisiones;
    if (!cs || !cs.length) {
      return '<p class="empty-note">Sin giro a comisión registrado.</p>';
    }
    // la fecha de ingreso/dictamen suele ser la misma para todas las comisiones
    // de un mismo giro (plenario): se muestra una sola vez en vez de repetirla.
    var ingreso = cs.map(function (c) { return c.fecha_ingreso; }).filter(Boolean)[0];
    var egreso = cs.map(function (c) { return c.fecha_egreso; }).filter(Boolean)[0];
    var nombres = cs.map(function (c) { return titleCaseComision(c.comision); }).join(" · ");
    var fechaLinea = ingreso ? ("Ingresó " + ingreso + (egreso ? " · dictamen " + egreso : " · en trámite")) : "";
    return (
      '<div class="tramite-comisiones">' +
        '<div class="tramite-comision-row">' +
          '<span class="nombre">' + escapeHTML(nombres) + '</span>' +
          '<span class="fechas">' + fechaLinea + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  function renderDetail(expediente) {
    var p = porExpediente[expediente];
    if (!p) {
      elViewDetail.innerHTML = '<p class="empty-note">No se encontró el expediente ' + escapeHTML(expediente) + '.</p>' +
        '<button class="detail-back" id="detail-back-nf">← Volver al listado</button>';
      document.getElementById("detail-back-nf").addEventListener("click", function () { location.hash = ""; });
      return;
    }
    var nota = p.nota;
    var t = p.tramite;

    var html = "";
    html += '<button class="detail-back" id="detail-back">';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Volver al listado';
    html += '</button>';

    html += '<div class="detail-head">';
    html += '<div class="expediente">' + p.expediente + ' · ' + escapeHTML(p.camara_actual) + '</div>';
    html += '<h1>' + escapeHTML(p.titulo || p.nombre_corto) + '</h1>';
    html += '<div class="pill-row">' + pillRowHTML(p) + '</div>';
    html += '<div class="detail-actions">';
    if (p.url) {
      html += '<a class="btn-primary" href="' + p.url + '" target="_blank" rel="noopener">Ver expediente en el Senado <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>';
    } else {
      html += '<span class="empty-note">Link al expediente pendiente de carga.</span>';
    }
    html += '</div>';
    html += '</div>';

    // Resumen del mensaje del PEN
    html += '<div class="section"><h2>📩 Resumen del mensaje del Poder Ejecutivo</h2>';
    html += bulletListHTML(nota && nota.resumen_mensaje_pen, "Resumen detallado pendiente de carga.");
    html += '</div>';

    // Resumen del expediente
    html += '<div class="section"><h2>📄 Resumen del expediente</h2>';
    html += bulletListHTML(nota && nota.resumen_expediente, "Resumen detallado pendiente de carga.");
    html += '</div>';

    // Trámite en comisión
    html += '<div class="section"><h2>🏛️ Trámite en comisión</h2>';
    if (!p.sin_datos_de_planilla) {
      html += '<p class="meta-line">' + camaraTagHTML("Senado") + ' según la planilla del Senado</p>';
    }
    html += tramiteComisionesHTML(p);
    if (nota && nota.reunion_comision) {
      var rc = nota.reunion_comision;
      html += '<p class="sub-label">Reunión de comisión ' + camaraTagHTML(rc.camara) + '</p>';
      html += '<p class="meta-line">' + escapeHTML(rc.fecha) + (rc.comision ? " · " + escapeHTML(titleCaseComision(rc.comision)) : "") + '</p>';
      if (rc.resumen) html += '<p class="meta-line">' + escapeHTML(rc.resumen) + '</p>';
      if (rc.posturas_principales && rc.posturas_principales.length) {
        html += '<p class="sub-label">Posturas principales</p>';
        html += bulletListHTML(rc.posturas_principales, "");
      }
    }
    html += '</div>';

    // Orden del Día
    if (t.orden_del_dia || (nota && nota.orden_del_dia_detalle)) {
      html += '<div class="section"><h2>📋 Orden del Día</h2>';
      if (t.orden_del_dia) {
        html += '<p class="meta-line">' + camaraTagHTML("Senado") + ' N° ' + t.orden_del_dia.numero + '/' + t.orden_del_dia.anio + '</p>';
      }
      if (nota && nota.orden_del_dia_detalle) {
        var od = nota.orden_del_dia_detalle;
        if (od.firmantes && od.firmantes.length) {
          html += '<p class="sub-label">Firmantes ' + camaraTagHTML(od.camara) + '</p>';
          html += bulletListHTML(od.firmantes, "");
        }
        if (od.diferencias_clave && od.diferencias_clave.length) {
          html += '<p class="sub-label">Diferencias clave vs. proyecto original</p>';
          html += bulletListHTML(od.diferencias_clave, "");
        }
      }
      html += '</div>';
    }

    // Sanción / media sanción
    if (t.sancion_fecha || (nota && nota.sancion_detalle)) {
      var sd = nota && nota.sancion_detalle;
      html += '<div class="section"><h2>🗳️ Sanción' + (sd ? ' ' + camaraTagHTML(sd.camara) : '') + '</h2>';
      if (t.sancion_fecha) {
        html += '<p class="meta-line">' + camaraTagHTML("Senado") + ' aprobó el ' + t.sancion_fecha + '</p>';
      }
      if (sd) {
        if (sd.link_taquigrafica) {
          html += '<p class="meta-line"><a href="' + escapeHTML(sd.link_taquigrafica) + '" target="_blank" rel="noopener">Ver versión taquigráfica →</a></p>';
        }
        if (sd.posturas_principales && sd.posturas_principales.length) {
          html += '<p class="sub-label">Posturas principales y resultado' + (sd.camara ? ' en ' + escapeHTML(sd.camara) : '') + '</p>';
          html += bulletListHTML(sd.posturas_principales, "");
        }
      }
      html += '</div>';
    }

    elViewDetail.innerHTML = html;
    document.getElementById("detail-back").addEventListener("click", function () { location.hash = ""; });
  }

  function route() {
    var hash = location.hash;
    var m = hash.match(/^#\/(.+)$/);
    if (m) {
      var expediente = decodeURIComponent(m[1]);
      elControls.style.display = "none";
      elViewList.style.display = "none";
      elViewDetail.style.display = "block";
      renderDetail(expediente);
      window.scrollTo(0, 0);
    } else {
      elControls.style.display = "flex";
      elControls.style.flexDirection = "column";
      elViewList.style.display = "block";
      elViewDetail.style.display = "none";
      renderListView();
    }
  }

  // --- Filtros ---
  var searchTimer = null;
  elSearch.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = elSearch.value.trim().toLowerCase();
      renderListView();
    }, 120);
  });
  function renderCamaraToggle() {
    Array.prototype.forEach.call(elCamaraToggle.querySelectorAll(".camara-btn"), function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-camara") === state.camara ? "true" : "false");
    });
  }
  elCamaraToggle.addEventListener("click", function (e) {
    var btn = e.target.closest(".camara-btn");
    if (!btn) return;
    var val = btn.getAttribute("data-camara");
    state.camara = state.camara === val ? "" : val;
    renderCamaraToggle();
    renderListView();
  });
  elAutorSelect.addEventListener("change", function () {
    state.autor = elAutorSelect.value;
    renderListView();
  });
  elBtnClearFilters.addEventListener("click", function () {
    state.camara = "";
    state.autor = "";
    state.q = "";
    elSearch.value = "";
    elAutorSelect.value = "";
    renderCamaraToggle();
    renderListView();
  });

  window.addEventListener("hashchange", route);
  renderTabs();
  renderCamaraToggle();
  route();
})();
</script>
</body>
</html>
